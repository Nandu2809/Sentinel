version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-pass-2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-redis-pass!}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-pass!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sentinel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - sentinel-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentinel-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - sentinel-net

  auth-service:
    build:
      context: ../../backend
      dockerfile: auth-service/Dockerfile
    container_name: sentinel-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-pass-2026!}
      JWT_SECRET: ${JWT_SECRET:-change-me-very-long-secret-key-2026!}
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  gateway-service:
    build:
      context: ../../backend
      dockerfile: gateway-service/Dockerfile
    container_name: sentinel-gateway-service
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:-change-me-very-long-secret-key-2026!}
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  monitoring-service:
    build:
      context: ../../backend
      dockerfile: monitoring-service/Dockerfile
    container_name: sentinel-monitoring-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-pass-2026!}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  threat-service:
    build:
      context: ../../backend
      dockerfile: threat-service/Dockerfile
    container_name: sentinel-threat-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-pass-2026!}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  risk-service:
    build:
      context: ../../backend
      dockerfile: risk-service/Dockerfile
    container_name: sentinel-risk-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-pass-2026!}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  alert-service:
    build:
      context: ../../backend
      dockerfile: alert-service/Dockerfile
    container_name: sentinel-alert-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-pass-2026!}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  report-service:
    build:
      context: ../../backend
      dockerfile: report-service/Dockerfile
    container_name: sentinel-report-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-pass-2026!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  ai-engine:
    build:
      context: ../../ai-engine
      dockerfile: Dockerfile
    container_name: sentinel-ai-engine
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ai/status')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinel-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sentinel-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - sentinel-net

volumes:
  postgres_data:

networks:
  sentinel-net:
    driver: bridge
