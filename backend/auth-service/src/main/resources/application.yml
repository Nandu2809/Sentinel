server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: sentinel-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel_auth}
    username: ${SPRING_DATASOURCE_USERNAME:sentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: sentinel-auth-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

sentinel:
  security:
    allowed-origins: ${SENTINEL_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    jwt:
      issuer: ${JWT_ISSUER:sentinel-auth-service}
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  bootstrap:
    admin-email: ${SENTINEL_BOOTSTRAP_ADMIN_EMAIL:}
    admin-username: ${SENTINEL_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${SENTINEL_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level service=${spring.application.name} trace=%X{traceId:-} span=%X{spanId:-} thread=%thread logger=%logger{36} msg=\"%replace(%msg){'\"','\\\"'}\"%n"
  level:
    com.sentinel: INFO
    org.springframework.security: INFO

