server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-service-users
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
        - id: monitoring-service
          uri: ${MONITORING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/monitor/**,/api/v1/telemetry/**
        - id: threat-service
          uri: ${THREAT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/threat/**
        - id: alert-service
          uri: ${ALERT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/alerts/**
        - id: report-service
          uri: ${REPORT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/reports/**

jwt:
  secret: ${JWT_SECRET:replace-with-at-least-32-bytes-of-random-base64-or-text}
  issuer: ${JWT_ISSUER:sentinel-auth-service}

sentinel:
  cors:
    allowed-origins: ${SENTINEL_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
