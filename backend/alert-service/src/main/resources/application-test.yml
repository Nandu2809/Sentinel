server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:alerttestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    host: localhost
    port: 1025

sentinel:
  cors:
    allowed-origins: http://localhost:3000
