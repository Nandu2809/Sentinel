services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_auth}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  auth-service:
    build:
      context: ../../backend
      dockerfile: auth-service/Dockerfile
    container_name: sentinel-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_auth}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SENTINEL_BOOTSTRAP_ADMIN_EMAIL: ${SENTINEL_BOOTSTRAP_ADMIN_EMAIL:-}
      SENTINEL_BOOTSTRAP_ADMIN_USERNAME: ${SENTINEL_BOOTSTRAP_ADMIN_USERNAME:-}
      SENTINEL_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINEL_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  gateway-service:
    build:
      context: ../../backend
      dockerfile: gateway-service/Dockerfile
    container_name: sentinel-gateway-service
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  monitoring-service:
    build:
      context: ../../backend
      dockerfile: monitoring-service/Dockerfile
    container_name: sentinel-monitoring-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_auth}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  threat-service:
    build:
      context: ../../backend
      dockerfile: threat-service/Dockerfile
    container_name: sentinel-threat-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_auth}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

volumes:
  postgres_data:

networks:
  sentinel-net:
    driver: bridge
